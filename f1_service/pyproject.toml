[project]
name = "f1-service"
version = "0.1.0"
description = "F1 telemetry UDP listener, dispatcher, and recording service"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "influxdb-client>=1.30.0",
    "paho-mqtt>=2.0.0",
    "Pillow>=10.0.0",
    "pyserial>=3.5",
    "python-dotenv>=1.0.0",
]

[project.scripts]
f1-service = "cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1_service"]
force-include = {"cli.py" = "cli.py"}
